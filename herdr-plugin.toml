id = "herdr-tagr"
name = "Tagr"
version = "0.2.0"
min_herdr_version = "0.7.5"
description = "Concise, icon-first tab titles: app icon + folder + git branch."
platforms = ["linux", "macos", "windows"]

# Built once at install time.
[[build]]
command = ["cargo", "build", "--release"]

# Cargo emits herdr-tagr.exe on Windows, but a plugin command is one string for
# every platform and herdr skips PATHEXT resolution for a path with separators.
# A copy without the extension makes the one path below valid everywhere.
[[build]]
command = ["cmd", "/c", "copy", "/y", "target\\release\\herdr-tagr.exe", "target\\release\\herdr-tagr"]
platforms = ["windows"]

# Long-lived daemon: subscribes to the herdr event stream and retitles tabs.
[[startup]]
command = ["./target/release/herdr-tagr", "daemon"]

[[actions]]
id = "refresh"
title = "Tagr: refresh all tab titles"
command = ["./target/release/herdr-tagr", "refresh"]

[[actions]]
id = "adopt"
title = "Tagr: auto-title this tab"
command = ["./target/release/herdr-tagr", "adopt"]

[[actions]]
id = "release"
title = "Tagr: stop auto-titling this tab"
command = ["./target/release/herdr-tagr", "release"]

[[actions]]
id = "doctor"
title = "Tagr: explain this pane's title"
command = ["./target/release/herdr-tagr", "doctor"]
