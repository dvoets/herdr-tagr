# herdr-tagr configuration.
#
# Copy to the plugin's config directory and edit:
#   cp config.example.toml "$(herdr plugin config-dir herdr-tagr)/config.toml"
#
# Every value below is a default - a missing file, or a file with only the keys
# you care about, works fine. The daemon picks up edits without a restart.
#
# Glyphs are written as \uXXXX escapes rather than literal characters so this
# file stays plain ASCII and cannot be mangled in transit. TOML decodes them.
#
# Full reference: docs/configuration.md

[general]
# Coalescing window after a burst of herdr events before recomputing.
debounce_ms = 120
# Floor between two full passes, so a chatty agent cannot spin the daemon.
min_interval_ms = 250
# How long a pane's process listing stays usable before it is re-read.
process_ttl_ms = 1500
# Fallback polling when the event stream is unavailable. 0 disables it.
poll_ms = 0
# Log every rename (herdr plugin log list --plugin herdr-tagr).
debug = false
# Override the herdr endpoint. Empty uses HERDR_SOCKET_PATH, which herdr
# injects into every plugin command, then the platform default:
# ~/.config/herdr/herdr.sock on Unix, \\.\pipe\herdr on Windows.
socket_path = ""
# Rename tabs. Set false to leave the tab bar alone and use this purely as a
# source of sidebar metadata.
rename_tabs = true

[label]
show_icon = true
show_git = true
show_folder = true
separator = " "
# Hard cap on the rendered label, in characters.
max_length = 32
home_symbol = "~"
ellipsis = "\u2026"
# In a linked worktree, show the parent repository's name rather than the
# checkout directory. herdr names a worktree checkout after its branch
# (.herdr/worktrees/herdr-tagr/feat-sidebar-colours), so the directory would
# otherwise repeat the branch and crowd it out of the label:
#
#   false   \uf120 feat-sidebar-colours (\ue725 feat/...
#   true    \uf120 herdr-tagr (\ue725 feat/sideba...)
#
# herdr reports the worktree's parent repository itself, so this is a lookup
# rather than a guess from the directory name.
worktree_repo_name = true

[git]
# Longer branch names are truncated to this many characters.
branch_max = 12

# herdr paints a tab label with a single style and never parses it, so colour
# cannot separate the branch from the folder. Brackets do that job instead -
# the same trick a shell prompt uses for its git fragment.
#
#   after_folder    api (\ue725 feat/auth)
#   before_folder   (\ue725 feat/auth) api
position = "after_folder"
# Brackets around a named git segment. Use ["", ""] for none.
wrap = ["(", ")"]

# What to show when you are on the repository's default branch.
#
# The default names it like any other branch, so the git fragment keeps one
# fixed slot on every tab. The shortening styles save a few columns, but a
# glyph-only marker leads while a named one trails - so with those, the marker
# changes sides depending on which branch you are on.
#   "name"          (default)  folder (\ue725 main)
#   "repo_glyph"               \uf401 folder
#   "branch_glyph"             \ue725 folder
#   "nothing"                  folder           - no git marker at all
default_branch_style = "name"
# Always treated as default branches, in addition to whatever origin/HEAD says.
default_branches = ["main", "master", "trunk"]

repo_glyph = "\uf401"      # nf-oct-repo
branch_glyph = "\ue725"    # nf-dev-git_branch
detached_glyph = "\uf417"  # nf-oct-git_commit
detached_len = 7

# How long a directory stays remembered as "not a repository", so a git init or
# a finished clone is picked up without restarting the daemon.
recheck_non_repo_ms = 10000

[sidebar]
# Publish the label's parts (icon, folder, branch) as herdr pane metadata, so
# the sidebar can show and colour them individually.
#
# Worth doing because the sidebar is narrower than the tab bar but can colour
# each token: a branch that fits in a tab gets truncated away in the panel
# ("herdr-tagr (..."), and as its own token it survives and can be coloured.
#
# Harmless when unused - herdr only renders tokens a sidebar layout asks for.
# Put this in ~/.config/herdr/config.toml to use them:
#
#   [ui.sidebar.agents]
#   row_gap = 0
#   rows = [
#     [
#       "state_icon",
#       { token = "$icon", fg = "#cba6f7", dim = false },
#       { token = "$folder", fg = "#cdd6f4", bold = true, dim = false },
#     ],
#     [{ token = "$branch", fg = "#a6e3a1", dim = false }],
#   ]
#
# The app icon already says which agent it is, so herdr's default "agent" row
# (a line reading "claude") is dropped, which buys the width the branch needs.
# dim = false lifts the rows off the panel background.
report_tokens = true

# Blank columns prefixed to the branch token, to line it up under the row above
# when the sidebar puts the branch on its own row. herdr has no literal-text
# token, so the padding has to come from the value - written with U+2800
# BRAILLE PATTERN BLANK, because herdr trims real whitespace off token values.
#
# Count the columns the earlier row spends before the token you are aligning
# to. herdr separates sidebar tokens with " \u00b7 ", except after a state icon,
# where it uses a single space. For ["state_icon", "$icon", "$folder"] that is
# 1 + 1 + 1 + 3 = 6, and the branch token itself opens with a glyph and a
# space, so 4 puts the branch name under the folder name:
#
#   \u2713 \uf069 \u00b7 herdr-tagr
#       \ue725 main
branch_indent = 0

# Names the tokens are published under, referenced from herdr's sidebar layout
# as $icon, $folder and $branch. Rename them if they would collide with another
# plugin's tokens.
token_icon = "icon"
token_folder = "folder"
token_branch = "branch"

[ssh]
enabled = true
# Recover the remote directory from the title the remote shell sets.
# Falls back to showing the host alone when the title is not a path.
remote_folder_from_title = true
separator = ":"

[adoption]
# Which tabs this plugin is allowed to title:
#   "generated_only" (default) only labels that still look herdr-generated
#                              (a number, an agent name, the folder name).
#                              Names you typed are never touched.
#   "always"                   every tab, backing off permanently once you
#                              rename one by hand. Pair with
#                              prompt_new_tab_name = false in herdr's config.
#   "opt_in"                   nothing, until a tab is handed over with the
#                              "Tagr: auto-title this tab" action.
mode = "generated_only"
# Extra labels to treat as herdr-generated, beyond the built-in list.
generated_names = []

# Title every tab created after the daemon started, whatever herdr called it.
#
# Turn this on together with herdr's own setting:
#
#   [ui]
#   prompt_new_tab_name = false     # in ~/.config/herdr/config.toml
#
# With the prompt off, herdr stops asking for a name and invents one, so no one
# chose it and there is nothing to preserve - every new tab is simply titled.
# Leave this off while the prompt is on, or a name you type into the prompt is
# overwritten the moment you finish typing it.
#
# Renaming a tab still wins either way: that tab is left alone from then on.
adopt_new_tabs = false

# Per-app overrides, merged over the built-in table by id. Higher rank wins when
# several known apps share a pane, which is how "claude running nvim" resolves.
#
# Built-in ranks: ssh 90 - editors 76-80 - yazi 75 - lazygit/lazydocker 70 -
# k9s 68 - btop 66 - ncdu 65 - agents 60 - pagers 48-50 - tmux 45 -
# dev tooling 20-30 - shell 10.

