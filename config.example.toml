# herdr-tagr configuration.
#
# Copy to the plugin's config directory and edit:
#   cp config.example.toml "$(herdr plugin config-dir herdr-tagr)/config.toml"
#
# Every value below is a default - a missing file, or a file with only the keys
# you care about, works fine. The daemon picks up edits without a restart.
#
# Glyphs are written as \uXXXX escapes rather than literal characters so this
# file stays plain ASCII and cannot be mangled in transit. TOML decodes them.

[general]
# Coalescing window after a burst of herdr events before recomputing.
debounce_ms = 120
# Floor between two full passes, so a chatty agent cannot spin the daemon.
min_interval_ms = 250
# How long a pane's process listing stays usable before it is re-read.
process_ttl_ms = 1500
# Fallback polling when the event stream is unavailable. 0 disables it.
poll_ms = 0
# Log every rename (herdr plugin log list --plugin herdr-tagr).
debug = false

[label]
show_icon = true
show_git = true
show_folder = true
separator = " "
# Hard cap on the rendered label, in characters.
max_length = 32
home_symbol = "~"
ellipsis = "\u2026"

[git]
# Longer branch names are truncated to this many characters.
branch_max = 12

# herdr paints a tab label with a single style and never parses it, so colour
# cannot separate the branch from the folder. Brackets do that job instead -
# the same trick a shell prompt uses for its git fragment.
#
#   after_folder    api (\ue725 feat/auth)
#   before_folder   (\ue725 feat/auth) api
position = "after_folder"
# Brackets around a named git segment. Use ["", ""] for none.
wrap = ["(", ")"]

# What to show when you are on the repository's default branch.
#
# The default names it like any other branch, so the git fragment keeps one
# fixed slot on every tab. The shortening styles save a few columns, but a
# glyph-only marker leads while a named one trails - so with those, the marker
# changes sides depending on which branch you are on.
#   "name"          (default)  folder (\ue725 main)
#   "repo_glyph"               \uf401 folder
#   "branch_glyph"             \ue725 folder
#   "nothing"                  folder           - no git marker at all
default_branch_style = "name"
# Always treated as default branches, in addition to whatever origin/HEAD says.
default_branches = ["main", "master", "trunk"]

repo_glyph = "\uf401"      # nf-oct-repo
branch_glyph = "\ue725"    # nf-dev-git_branch
detached_glyph = "\uf417"  # nf-oct-git_commit
detached_len = 7

# How long a directory stays remembered as "not a repository", so a git init or
# a finished clone is picked up without restarting the daemon.
recheck_non_repo_ms = 10000

[ssh]
enabled = true
# Recover the remote directory from the title the remote shell sets.
# Falls back to showing the host alone when the title is not a path.
remote_folder_from_title = true
separator = ":"

[adoption]
# Which tabs this plugin is allowed to title:
#   "generated_only" (default) only labels that still look herdr-generated
#                              (a number, an agent name, the folder name).
#                              Names you typed are never touched.
#   "always"                   every tab, backing off permanently once you
#                              rename one by hand. Pair with
#                              prompt_new_tab_name = false in herdr's config.
#   "opt_in"                   nothing, until a tab is handed over with the
#                              "Tagr: auto-title this tab" action.
mode = "generated_only"
# Extra labels to treat as herdr-generated, beyond the built-in list.
generated_names = []

# Per-app overrides, merged over the built-in table by id. Higher rank wins when
# several known apps share a pane, which is how "claude running nvim" resolves.
#
# Built-in ranks: ssh 90 - editors 76-80 - yazi 75 - lazygit/lazydocker 70 -
# k9s 68 - btop 66 - ncdu 65 - agents 60 - pagers 48-50 - tmux 45 -
# dev tooling 20-30 - shell 10.

