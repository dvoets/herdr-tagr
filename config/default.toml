# herdr-tagr shipped defaults.
#
# This file is applied automatically. It is the plugin's opinion about how
# things should look, and you do not need to copy it anywhere.
#
# To change something, set just that key in your own config:
#
#   $EDITOR "$(herdr plugin config-dir herdr-tagr)/config.toml"
#
# Values are layered, later winning per key:
#
#   1. built-in defaults in the code
#   2. this file
#   3. your config.toml
#
# So your file only needs the handful of keys you disagree with - everything
# else keeps the value below. The daemon picks up edits without a restart.
#
# Glyphs are written as \uXXXX escapes rather than literal characters so this
# file stays plain ASCII and cannot be mangled in transit. TOML decodes them.
#
# Full reference: ../docs/configuration.md

[general]
# Coalescing window after a burst of herdr events before recomputing.
debounce_ms = 120
# Floor between two full passes, so a chatty agent cannot spin the daemon.
min_interval_ms = 250
# How long a pane's process listing stays usable before it is re-read.
process_ttl_ms = 1500
# Fallback poll, so a missed or dropped event cannot leave the sidebar showing
# a status that has moved on. The plugin is event-driven and this is only a
# safety net, so it can be slow; 0 disables it.
poll_ms = 5000
# Log every rename (herdr plugin log list --plugin herdr-tagr).
debug = false
# Override the herdr endpoint. Empty uses HERDR_SOCKET_PATH, which herdr
# injects into every plugin command, then the platform default:
# ~/.config/herdr/herdr.sock on Unix, \\.\pipe\herdr on Windows.
socket_path = ""
# Rename tabs. Set false to leave the tab bar alone and use this purely as a
# source of sidebar metadata.
rename_tabs = true

[label]
show_icon = true
show_git = true
show_folder = true
separator = " "
# Sits between a glyph and the name it marks, wherever the two are joined: the
# git fragment in a tab label, and the folder and branch tokens in the sidebar.
# "" butts them together, "  " opens them up.
glyph_separator = " "
# Hard cap on the rendered label, in characters.
max_length = 32
home_symbol = "~"
ellipsis = "\u2026"
# In a linked worktree, show the parent repository's name rather than the
# checkout directory. herdr names a worktree checkout after its branch
# (.herdr/worktrees/herdr-tagr/feat-sidebar-colours), so the directory would
# otherwise repeat the branch and crowd it out of the label:
#
#   false   \uf120 feat-sidebar-colours (\ue725 feat/...
#   true    \uf120 herdr-tagr (\ue725 feat/sideba...)
#
# herdr reports the worktree's parent repository itself, so this is a lookup
# rather than a guess from the directory name.
worktree_repo_name = true

[git]
# Longer branch names are truncated to this many characters.
branch_max = 12

# herdr paints a tab label with a single style and never parses it, so colour
# cannot separate the branch from the folder. Brackets do that job instead -
# the same trick a shell prompt uses for its git fragment.
#
#   after_folder    api (\ue725 feat/auth)
#   before_folder   (\ue725 feat/auth) api
position = "after_folder"
# Brackets around a named git segment. Use ["", ""] for none.
wrap = ["(", ")"]

# What to show when you are on the repository's default branch.
#
# The default names it like any other branch, so the git fragment keeps one
# fixed slot on every tab. The shortening styles save a few columns, but a
# glyph-only marker leads while a named one trails - so with those, the marker
# changes sides depending on which branch you are on.
#   "name"          (default)  folder (\ue725 main)
#   "repo_glyph"               \uf401 folder
#   "branch_glyph"             \ue725 folder
#   "nothing"                  folder           - no git marker at all
default_branch_style = "name"
# Always treated as default branches, in addition to whatever origin/HEAD says.
default_branches = ["main", "master", "trunk"]

repo_glyph = "\uf401"      # nf-oct-repo
branch_glyph = "\ue725"    # nf-dev-git_branch
detached_glyph = "\uf417"  # nf-oct-git_commit
detached_len = 7

# Which side of the branch name (or short commit) its glyph sits on - in the
# tab label and in the sidebar's branch token alike.
#
#   "before" (default)  \ue725 feat/auth
#   "after"             feat/auth \ue725
#   "off"               feat/auth        - the name alone, glyph kept in config
#
# "before" is what sidebar.branch_indent is measured against: moving the glyph
# to the other side moves the name two columns left, so raise the indent by the
# same amount to keep the branch under the folder.
branch_glyph_position = "before"

# How long a directory stays remembered as "not a repository", so a git init or
# a finished clone is picked up without restarting the daemon.
recheck_non_repo_ms = 10000

[sidebar]
# Publish the label's parts (icon, folder, branch) as herdr pane metadata, so
# the sidebar can show and colour them individually.
#
# Worth doing because the sidebar is narrower than the tab bar but can colour
# each token: a branch that fits in a tab gets truncated away in the panel
# ("herdr-tagr (..."), and as its own token it survives and can be coloured.
#
# Harmless when unused - herdr only renders tokens a sidebar layout asks for.
# Put this in ~/.config/herdr/config.toml to use them:
#
#   [ui.sidebar.agents]
#   row_gap = 0
#   rows = [
#     [
#       "state_icon",
#       { token = "$icon", fg = "#cba6f7", dim = false },
#       { token = "$folder", fg = "#cdd6f4", bold = true, dim = false },
#     ],
#     [{ token = "$branch", fg = "#a6e3a1", dim = false }],
#   ]
#
# The app icon already says which agent it is, so herdr's default "agent" row
# (a line reading "claude") is dropped, which buys the width the branch needs.
# dim = false lifts the rows off the panel background.
report_tokens = true

# Blank columns prefixed to the branch token, to line it up under the row above
# when the sidebar puts the branch on its own row. herdr has no literal-text
# token, so the padding has to come from the value - written with U+2800
# BRAILLE PATTERN BLANK, because herdr trims real whitespace off token values.
#
# herdr indents the first row of an agent entry by 1 column and every
# continuation row by 3. With the three-row layout in config/herdr.toml the
# folder and the branch are each alone on a continuation row:
#
#   row 1   indent 1 + icon 1 + " \u00b7 " 3   -> $activity starts at column 5
#   row 2   indent 3                        -> $folder starts at column 3
#   row 3   indent 3 + pad                  -> $branch starts at 3 + pad
#
# so 0 lines the folder and branch up: both tokens are a glyph, a space and a
# name, at the same indent. Raise it only if you move the folder back up beside
# the icon, where the icon and its separator push it 2 columns right.
branch_indent = 0

# Leads the folder token in the sidebar, so the folder carries a mark of its own
# the way the branch row does. U+F07B nf-fa-folder, verified present in Hack
# Nerd Font; U+F07C is the open folder, U+F413 the Octicons directory and
# U+E5FF the Seti one. Set to "" to drop it.
#
# Sidebar only, deliberately: a tab label already leads with the app icon, so a
# folder glyph there costs two columns without saying anything the label does
# not already say.
folder_glyph = "\uf07b"

# Which side of the folder name its glyph sits on, taking the same three values
# as git.branch_glyph_position. "before" is what puts it in the same column as
# the branch glyph on the row below, which is why the two rows read as a pair;
# "off" keeps the glyph in your config while dropping it from the row.
folder_glyph_position = "before"

# Publishes what the agent is doing as its own token, taken from herdr's
# terminal_title_stripped - the title Claude Code sets, which is the session's
# subject ("Laptop performance issue"). Only agent panes get it: a plain
# shell's title is its prompt, which says nothing worth a row.
activity = true

# Columns the activity text is windowed to. The socket does not expose the
# sidebar's width, so it has to be told: herdr's sidebar_width defaults to 26,
# less 1 for the row indent, 1 for the icon, 3 for the separator and 1 for the
# scrollbar. Lower it if you widened the panel's other rows.
activity_width = 20

# Milliseconds per scroll step. Every step is one metadata write per scrolling
# pane, so this is the knob that decides the cost - and nothing is written at
# all while every line fits.
activity_ms = 220

# Joins the end of the text back round to its start as it wraps, so a scrolling
# line reads as a loop rather than a jump. U+2022 BULLET.
activity_gap = "   \u2022   "

# Which panes scroll. Text that already fits never scrolls whatever this says.
#
#   "working" (default)  only panes whose agent is working
#   "always"             every pane whose text overflows, idle ones included
#   "off"                nobody: published once, and herdr truncates it
#
# The row itself exists either way, so an entry keeps its height and the panel
# does not reflow as agents start and stop - an idle line just sits still,
# truncated by herdr. Every scroll step is a write that makes herdr redraw,
# which is why "always" is not the default: see docs/sidebar.md.
activity_scroll = "working"

# Which way the words travel. "left" is the LED-sign direction: words march
# leftwards out of the row while later ones arrive from the right. "right"
# reverses it, which reads oddly for text but is there if you want it.
activity_direction = "left"

# Columns moved per frame. Raising this scrolls faster without costing any more
# writes - the cost is one write per frame whatever the step - at the price of
# smoothness: 1 glides, 3 visibly jumps. 0 is read as 1.
activity_step = 1

# How long to rest at the start of every lap, so the opening words - which are
# the ones that say what is happening - can be read before the line sets off.
#
# Counted in whole frames of activity_ms, so anything under one frame is no
# pause at all: with the default 220ms frame, 1000 holds for 4 frames (880ms).
# The pause costs nothing, since a line that is not moving is not written.
activity_dwell_ms = 0

# Let a line that has stopped being driven finish its lap, so it comes to rest
# at its first column rather than frozen mid-word wherever the agent stopped.
# false snaps it home in a single frame instead.
activity_wind_down = true

# Where the line's words come from.
#
#   "transcript" (default)  what the agent is doing now, read from Claude
#                           Code's session transcript - the newest tool call,
#                           named in a few words ("Run the suite",
#                           "Editing label.rs"). herdr hands over the agent's
#                           session id and Claude Code names its transcript
#                           after exactly that, so the mapping is exact.
#   "title"                 herdr's terminal_title_stripped: the session's
#                           subject rather than its work, which changes rarely
#                           and is often just "Claude Code".
#
# "transcript" falls back to the title only when there is nothing to read at
# all: a pane that is not Claude, a session that has not written its transcript
# yet, or an internal format that has moved. An idle pane keeps showing its last
# call - what it just did - because the title is set lazily and is usually the
# generic "Claude Code", which says less than the stalest tool call.
activity_source = "transcript"

# Longest activity line kept, in characters, so one enormous tool description
# cannot become a scroll loop that takes a minute to come round.
activity_max = 60

# Names the tokens are published under, referenced from herdr's sidebar layout
# as $icon, $folder and $branch. Rename them if they would collide with another
# plugin's tokens.
token_icon = "icon"
token_folder = "folder"
token_branch = "branch"
token_activity = "activity"

# How each tool call is worded on the activity line, by the tool's name.
#
# `{}` is replaced by whatever that tool acts on - the plugin knows where each
# one keeps it:
#
#   Bash                  the call's own written description, else the command
#                         reduced to its program and first real argument
#   Read Edit Write       the file's name, without its path
#   NotebookEdit          the same
#   Grep Glob             the pattern
#   Task Agent            the subagent's description
#   Skill                 the skill's name
#   WebFetch              the URL's host
#   WebSearch             the query
#   anything else         the first of description, file_path, pattern, query,
#                         url or command that the call carries
#
# A template with no `{}` is used as it stands, which is how AskUserQuestion
# and TodoWrite get a fixed phrase. Entries are merged one key at a time, so
# renaming one tool leaves the other thirteen alone:
#
#   [sidebar.activity_verbs]
#   Read = "Looking at {}"
#   Grep = "Hunting for {}"
#
# A tool with no entry here shows its own bare name ("WebFetch"), and so does
# one whose `{}` cannot be filled - a new tool still gets a row rather than
# blanking it. Setting a template to "" opts a tool back into that fallback.
[sidebar.activity_verbs]
Bash = "{}"
Read = "Reading {}"
Edit = "Editing {}"
NotebookEdit = "Editing {}"
Write = "Writing {}"
Grep = "Searching {}"
Glob = "Finding {}"
Task = "Delegating {}"
Agent = "Delegating {}"
Skill = "Running {}"
WebFetch = "Fetching {}"
WebSearch = "Searching {}"
AskUserQuestion = "Asking you"
TodoWrite = "Planning"

[ssh]
enabled = true
# Recover the remote directory from the title the remote shell sets.
# Falls back to showing the host alone when the title is not a path.
remote_folder_from_title = true
separator = ":"

[adoption]
# Which tabs this plugin is allowed to title:
#   "generated_only" (default) only labels that still look herdr-generated
#                              (a number, an agent name, the folder name).
#                              Names you typed are never touched.
#   "always"                   every tab, backing off permanently once you
#                              rename one by hand. Pair with
#                              prompt_new_tab_name = false in herdr's config.
#   "opt_in"                   nothing, until a tab is handed over with the
#                              "Tagr: auto-title this tab" action.
mode = "generated_only"
# Extra labels to treat as herdr-generated, beyond the built-in list.
generated_names = []

# Title every tab created after the daemon started, whatever herdr called it.
#
# Turn this on together with herdr's own setting:
#
#   [ui]
#   prompt_new_tab_name = false     # in ~/.config/herdr/config.toml
#
# With the prompt off, herdr stops asking for a name and invents one, so no one
# chose it and there is nothing to preserve - every new tab is simply titled.
# Leave this off while the prompt is on, or a name you type into the prompt is
# overwritten the moment you finish typing it.
#
# Renaming a tab still wins either way: that tab is left alone from then on.
#
# Shipped on, which assumes you also turned herdr's prompt off as above. If you
# keep the prompt, set this to false in your own config or the name you type is
# overwritten as you finish typing it.
adopt_new_tabs = true

# Per-app overrides, merged over the built-in table by id. Higher rank wins when
# several known apps share a pane, which is how "claude running nvim" resolves.
#
# Built-in ranks: ssh 90 - editors 76-80 - yazi 75 - lazygit/lazydocker 70 -
# k9s 68 - btop 66 - ncdu 65 - agents 60 - pagers 48-50 - tmux 45 -
# dev tooling 20-30 - shell 10.

# [apps.claude]
# icon = "\uf069"
# rank = 85            # let claude outrank an editor it launched

# [apps.nvim]
# icon = "\ue6ae"
# matches = ["nvim", "neovim", "lvim"]

# Name the tab after the file the app has open, instead of the folder it is
# sitting in. The file comes from the pane's terminal title, so the app has to
# be publishing one - which most are not, by default.
#
#   \uf120 Downloads       a shell in ~/Downloads
#   \ue6ae notes.txt       nvim in ~/Downloads, editing notes.txt
#
# For nvim, two lines of its own config - 'title' ships off:
#
#   vim.o.title = true
#   vim.o.titlestring = "%t"      -- just the name; %f for the path
#
# The label then follows the selected buffer, changing as you switch between
# them. That is the point, and also the cost: a tab bar is a map you navigate
# by position, and a label that rewrites itself is harder to learn. Try it
# before leaving it on.
#
# Off for every shipped app, deliberately. A title nobody set is not blank - it
# still holds whatever the shell last wrote there ("daan@host:~/Downloads", or
# the name of the command being run), so reading it uninvited would put a shell
# prompt in the tab. Titles that look like those, like a path with no file, or
# like an empty buffer ("[No Name]") are refused and the folder is used instead.
#
# [apps.nvim]
# folder_from_title = true

# A new app the plugin does not ship. The id doubles as the process name
# unless you give an explicit `matches` list.
# [apps.psql]
# icon = "\ue76e"
# rank = 55
