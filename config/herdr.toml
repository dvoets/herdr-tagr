# The herdr-side half of herdr-tagr's setup.
#
# These keys live in herdr's own config, not the plugin's, so the plugin cannot
# apply them for you. Copy them into:
#
#   ~/.config/herdr/config.toml        (Linux, macOS, WSL)
#   %APPDATA%\herdr\config.toml        (Windows)
#
# then run `herdr server reload-config`.
#
# Without the [ui.sidebar.agents] block the plugin still titles tabs; it just
# publishes sidebar tokens that nothing renders.

[ui]
# Create tabs immediately with generated names instead of asking, and let the
# plugin name them. Pair with adopt_new_tabs = true, which is the shipped
# default.
prompt_new_tab_name = false

# Agent panel rows, built from the tokens the plugin publishes.
#
# The workspace name repeated on every row is dropped, and so is herdr's
# "agent" row - a line reading "claude" - because the icon already says it.
# That buys the width for the branch, which gets its own row and so cannot be
# truncated away. dim = false lifts the rows off the panel background.
[ui.sidebar.agents]
row_gap = 0
# The app icon doubles as the activity light. herdr can only colour a token by
# its value, and the glyph is the same whatever the agent is doing, so the
# plugin publishes one icon token per status and populates only the matching
# one. A token with no value is skipped when the row is drawn, so exactly one
# of the five renders and it costs no width.
#
# Colours are herdr's own, from status_color():
#   working #f9e2af yellow   blocked #f38ba8 red     done #94e2d5 teal
#   idle    #a6e3a1 green    unknown #6c7086 grey
#
# This replaces herdr's state_icon, which is why it is not in the row.
rows = [
  [
    { token = "$icon_working", fg = "#f9e2af", dim = false },
    { token = "$icon_blocked", fg = "#f38ba8", bold = true, dim = false },
    { token = "$icon_done", fg = "#94e2d5", dim = false },
    { token = "$icon_idle", fg = "#a6e3a1", dim = false },
    { token = "$icon_unknown", fg = "#6c7086", dim = false },
    # $folder leads with the plugin's folder_glyph, so the glyph takes this
    # token's colour and weight rather than having its own.
    { token = "$folder", fg = "#cdd6f4", bold = true, dim = false },
  ],
  [{ token = "$branch", fg = "#a6e3a1", dim = false }],
]
